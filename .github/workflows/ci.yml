name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  clean-checkout:
    name: Clean checkout workspace
    # The bare self-hosted pool has no Rust toolchain (job 123467070998:
    # `cargo: command not found`). rdpapp, rustnzb and rustTorrent pin the
    # rust-heavy runner; dtolnay/rust-toolchain makes `cargo` present even
    # when the image has none.
    runs-on: [self-hosted, rust-heavy]
    env:
      DATABASE_URL: sqlite:///tmp/email-test.db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reject dependencies outside the repository
        run: |
          if git grep -nE 'path[[:space:]]*=[[:space:]]*"\.\./\.\./\.\.' -- '*Cargo.toml'; then
            echo "Cargo manifests must not depend on sibling repositories"
            exit 1
          fi

      - name: Read Rust toolchain from rust-toolchain.toml
        id: rust-toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install native desktop build dependencies
        run: |
          # Self-hosted runners execute as root and have no sudoers entry.
          if [ "$(id -u)" -eq 0 ]; then APT=apt-get; else APT="sudo apt-get"; fi
          $APT update
          $APT install -y pkg-config libssl-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Verify locked dependency resolution
        run: cargo metadata --locked --format-version 1 > /dev/null

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install the pinned Python tool runner
        run: python -m pip install uv==0.13.1

      - name: Regenerate and verify the Python client
        run: |
          OPENAPI_SPEC_OUTPUT=/tmp/email-rs-openapi.json ./scripts/generate-python-client.sh
          git diff --exit-code -- clients/python
          python - <<'PY'
          import json
          import pathlib
          import tomllib

          cargo = tomllib.loads(pathlib.Path("crates/email-server/Cargo.toml").read_text())
          python_client = tomllib.loads(pathlib.Path("clients/python/pyproject.toml").read_text())
          openapi = json.loads(pathlib.Path("/tmp/email-rs-openapi.json").read_text()) if pathlib.Path("/tmp/email-rs-openapi.json").exists() else None

          cargo_version = cargo["package"]["version"]
          python_version = python_client["project"]["version"]
          if openapi is None:
              raise SystemExit("OpenAPI version export was not captured")
          openapi_version = openapi["info"]["version"]
          if len({cargo_version, python_version, openapi_version}) != 1:
              raise SystemExit(
                  f"version mismatch: Cargo={cargo_version}, Python={python_version}, OpenAPI={openapi_version}"
              )
          PY

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  docker:
    runs-on: [self-hosted, docker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build production image from a clean checkout
        run: docker build --tag email-rs-ci .

  frontend:
    runs-on: [self-hosted]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build -- --outDir /tmp/frontend-dist --emptyOutDir
      - run: npm test

  mobile:
    runs-on: [self-hosted]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  ci:
    name: ci
    needs: [clean-checkout, docker, frontend, mobile]
    if: always()
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - name: gate
        env:
          CLEAN: ${{ needs.clean-checkout.result }}
          DOCKER: ${{ needs.docker.result }}
          FRONTEND: ${{ needs.frontend.result }}
          MOBILE: ${{ needs.mobile.result }}
        run: |
          set -euo pipefail
          failed=0
          for half in \
            "clean-checkout:$CLEAN" \
            "docker:$DOCKER" \
            "frontend:$FRONTEND" \
            "mobile:$MOBILE"
          do
            name="${half%%:*}"
            result="${half#*:}"
            case "$result" in
              success|skipped)
                echo "$name: $result"
                ;;
              *)
                echo "$name: $result"
                failed=1
                ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "every required job passed or was skipped"

