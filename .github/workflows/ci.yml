name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  clean-checkout:
    name: Clean checkout workspace
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///tmp/email-test.db
    steps:
      - uses: actions/checkout@v4

      - name: Reject dependencies outside the repository
        run: |
          if git grep -nE 'path[[:space:]]*=[[:space:]]*"\.\./\.\./\.\.' -- '*Cargo.toml'; then
            echo "Cargo manifests must not depend on sibling repositories"
            exit 1
          fi

      - name: Install native desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Verify locked dependency resolution
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image from a clean checkout
        run: docker build --tag email-rs-ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx vite build --outDir /tmp/frontend-dist --emptyOutDir

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
