name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  clean-checkout:
    name: Clean checkout workspace
    runs-on: [self-hosted]
    env:
      DATABASE_URL: sqlite:///tmp/email-test.db
    steps:
      - uses: actions/checkout@v4

      - name: Reject dependencies outside the repository
        run: |
          if git grep -nE 'path[[:space:]]*=[[:space:]]*"\.\./\.\./\.\.' -- '*Cargo.toml'; then
            echo "Cargo manifests must not depend on sibling repositories"
            exit 1
          fi

      - name: Install native desktop build dependencies
        run: |
          # Self-hosted runners execute as root and have no sudoers entry.
          if [ "$(id -u)" -eq 0 ]; then APT=apt-get; else APT="sudo apt-get"; fi
          $APT update
          $APT install -y pkg-config libssl-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Verify locked dependency resolution
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  docker:
    runs-on: [self-hosted, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image from a clean checkout
        run: docker build --tag email-rs-ci .

  frontend:
    runs-on: [self-hosted]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx vite build --outDir /tmp/frontend-dist --emptyOutDir

  mobile:
    runs-on: [self-hosted]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  ci:
    name: ci
    needs: [clean-checkout, docker, frontend, mobile]
    if: always()
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - name: gate
        env:
          CLEAN: ${{ needs.clean-checkout.result }}
          DOCKER: ${{ needs.docker.result }}
          FRONTEND: ${{ needs.frontend.result }}
          MOBILE: ${{ needs.mobile.result }}
        run: |
          set -euo pipefail
          failed=0
          for half in \
            "clean-checkout:$CLEAN" \
            "docker:$DOCKER" \
            "frontend:$FRONTEND" \
            "mobile:$MOBILE"
          do
            name="${half%%:*}"
            result="${half#*:}"
            case "$result" in
              success|skipped)
                echo "$name: $result"
                ;;
              *)
                echo "$name: $result"
                failed=1
                ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "every required job passed or was skipped"

