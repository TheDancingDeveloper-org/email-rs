name: Release dry run

# Build the image release.yml publishes, without pushing and without a tag.
# A release tag must not be the first time the packaging path is exercised.
on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-dry-run.yml'
      - 'Dockerfile'
      - 'frontend/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clients/python/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, docker]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: email-rs:dry-run
          cache-from: type=gha

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the Python client package without publishing
        working-directory: clients/python
        run: |
          python -m pip install --upgrade build
          python -m build
          test -n "$(find dist -name '*.whl' -o -name '*.tar.gz' | head -n 1)"
