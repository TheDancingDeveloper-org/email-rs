name: Release dry run

# Build the image release.yml publishes, without pushing and without a tag.
# A release tag must not be the first time the packaging path is exercised.
on:
  workflow_dispatch:
  schedule:
    # Nightly on main. The job's fork guard is a no-op for schedule and
    # workflow_dispatch; they only run from this repository.
    - cron: '17 3 * * *'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-dry-run.yml'
      - 'Dockerfile'
      - 'frontend/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clients/python/**'
      - 'scripts/**'
      - '.github/actionlint.yaml'

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, docker]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: email-rs:dry-run
          cache-from: type=gha

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the Python client package without publishing
        working-directory: clients/python
        run: |
          python -m pip install --upgrade build
          python -m build
          test -n "$(find dist -name '*.whl' -o -name '*.tar.gz' | head -n 1)"

  # Same server binary build as release.yml, publishing nothing.
  server-binaries:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: [self-hosted, rust-heavy]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: tar.gz
            native: true
          - target: aarch64-unknown-linux-gnu
            archive: tar.gz
            native: false
          - target: x86_64-pc-windows-gnu
            archive: zip
            native: false
          - target: aarch64-apple-darwin
            archive: tar.gz
            native: false
    steps:
      - uses: actions/checkout@v4

      - name: Skip macOS when this runner is not macOS
        id: host
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *-apple-darwin)
              if [ "$(uname -s)" != Darwin ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "The estate rust-heavy pool is not macOS; ${{ matrix.target }} is skipped."
              else
                echo "skip=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: steps.host.outputs.skip != 'true'
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}

      - name: Install the cross linker
        if: steps.host.outputs.skip != 'true' && matrix.native == false && !contains(matrix.target, 'apple')
        shell: bash
        run: |
          if [ "$(id -u)" -eq 0 ]; then APT=apt-get; else APT="sudo apt-get"; fi
          $APT update
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              dpkg --add-architecture arm64
              $APT update
              $APT install -y gcc-aarch64-linux-gnu pkg-config libssl-dev:arm64
              ;;
            x86_64-pc-windows-gnu)
              $APT install -y gcc-mingw-w64-x86-64
              ;;
          esac

      - name: Build email-server
        if: steps.host.outputs.skip != 'true'
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_SYSROOT_DIR: /usr/aarch64-linux-gnu
        run: |
          cargo build --locked --release -p email-server --bin email-server --target "${{ matrix.target }}"

      - name: Package, checksum and SBOM without publishing
        if: steps.host.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-cyclonedx >/dev/null 2>&1; then
            cargo install --locked cargo-cyclonedx --version 0.5.7 --root "$RUNNER_TEMP/cyclonedx"
            export PATH="$RUNNER_TEMP/cyclonedx/bin:$PATH"
          fi
          target="${{ matrix.target }}"
          tag="dry-run"
          stage="$(mktemp -d)"
          bin="target/${target}/release/email-server"
          if [ "${{ matrix.archive }}" = zip ]; then
            bin="${bin}.exe"
            name="email-server-${tag}-${target}.zip"
            cp "$bin" "$stage/email-server.exe"
            (cd "$stage" && zip -q -r "$name" email-server.exe)
          else
            name="email-server-${tag}-${target}.tar.gz"
            cp "$bin" "$stage/email-server"
            tar -C "$stage" -czf "$stage/$name" email-server
          fi
          mkdir -p release-artifacts
          mv "$stage/$name" "release-artifacts/$name"
          cargo cyclonedx --manifest-path crates/email-server/Cargo.toml \
            --format json --spec-version 1.5 \
            --override-filename "email-server-${tag}-${target}-sbom"
          mv "crates/email-server/email-server-${tag}-${target}-sbom.json" \
            "release-artifacts/email-server-${tag}-${target}.cdx.json"
          (cd release-artifacts && sha256sum -- * > SHA256SUMS)
          test -s release-artifacts/SHA256SUMS
          grep -q "${name}" release-artifacts/SHA256SUMS
          grep -q ".cdx.json" release-artifacts/SHA256SUMS
          echo "dry run packaged ${name}; nothing published"

  desktop-binaries:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: [self-hosted, rust-heavy]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            target: x86_64-unknown-linux-gnu
            package: tar.gz
          - os: windows
            target: x86_64-pc-windows-gnu
            package: zip
          - os: macos
            target: aarch64-apple-darwin
            package: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Skip until the egui desktop crate exists
        id: crate
        shell: bash
        run: |
          if [ ! -f crates/email-desktop/Cargo.toml ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "crates/email-desktop/Cargo.toml is not in this revision."
            echo "Desktop packaging is skipped until the egui app lands. email-desktop-fluent is not built."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip macOS when this runner is not macOS
        if: steps.crate.outputs.skip != 'true'
        id: host
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = macos ] && [ "$(uname -s)" != Darwin ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The estate rust-heavy pool is not macOS; the macOS desktop package is skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: steps.crate.outputs.skip != 'true' && steps.host.outputs.skip != 'true'
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}

      - name: Build and package the egui desktop app without publishing
        if: steps.crate.outputs.skip != 'true' && steps.host.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p email-desktop --bin email-desktop --target "${{ matrix.target }}"
          target="${{ matrix.target }}"
          stage="$(mktemp -d)"
          bin="target/${target}/release/email-desktop"
          mkdir -p release-artifacts
          case "${{ matrix.package }}" in
            zip)
              cp "${bin}.exe" "$stage/email-desktop.exe"
              name="email-desktop-dry-run-${target}.zip"
              (cd "$stage" && zip -q -r "$name" email-desktop.exe)
              mv "$stage/$name" "release-artifacts/$name"
              ;;
            *)
              cp "$bin" "$stage/email-desktop"
              name="email-desktop-dry-run-${target}.tar.gz"
              tar -C "$stage" -czf "$stage/$name" email-desktop
              mv "$stage/$name" "release-artifacts/$name"
              ;;
          esac
          (cd release-artifacts && sha256sum -- * > SHA256SUMS)
          echo "dry run packaged ${name}; nothing published"
