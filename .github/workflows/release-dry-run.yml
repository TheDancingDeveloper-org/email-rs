name: Release dry run

# Build the image release.yml publishes, without pushing and without a tag.
# A release tag must not be the first time the packaging path is exercised.
on:
  workflow_dispatch:
  schedule:
    # Nightly on main. The job's fork guard is a no-op for schedule and
    # workflow_dispatch; they only run from this repository.
    - cron: '17 3 * * *'
  # Every PR, so the release-dry-run gate can be a required check. The
  # changes job decides whether the heavy jobs run.
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap path check. Schedule and dispatch always run the dry run; a PR runs
  # it only when it touches the release packaging path.
  changes:
    runs-on: [self-hosted]
    timeout-minutes: 10
    outputs:
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Detect release path changes
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          release=false
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/release.yml|.github/workflows/release-dry-run.yml|Dockerfile|\
              frontend/*|crates/*|Cargo.toml|Cargo.lock|clients/python/*|scripts/*|\
              .github/actionlint.yaml)
                release=true
                echo "release path changed: $f"
                ;;
            esac
          done < <(git diff --name-only "$BASE...$HEAD")
          echo "release=$release" >> "$GITHUB_OUTPUT"

  dry-run:
    needs: changes
    if: needs.changes.outputs.release == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, docker]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: email-rs:dry-run
          cache-from: type=gha

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the Python client package without publishing
        working-directory: clients/python
        run: |
          python -m pip install --upgrade build
          python -m build
          test -n "$(find dist -name '*.whl' | head -n 1)"
          test -n "$(find dist -name '*.tar.gz' | head -n 1)"

      # Same artifact name release.yml's attach-binaries downloads.
      - uses: actions/upload-artifact@v4
        with:
          name: python-client
          path: clients/python/dist/*
          if-no-files-found: error
          retention-days: 1

  # Same server binary build as release.yml, publishing nothing.
  server-binaries:
    needs: changes
    if: needs.changes.outputs.release == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    runs-on: [self-hosted, rust-heavy]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: tar.gz
            native: true
          - target: aarch64-unknown-linux-gnu
            archive: tar.gz
            native: false
          - target: x86_64-pc-windows-gnu
            archive: zip
            native: false
          - target: aarch64-apple-darwin
            archive: tar.gz
            native: false
    steps:
      - uses: actions/checkout@v4

      - name: Skip macOS when this runner is not macOS
        id: host
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *-apple-darwin)
              if [ "$(uname -s)" != Darwin ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "::notice::The estate rust-heavy pool is not macOS; ${{ matrix.target }} is skipped and uploads no artifact."
              else
                echo "skip=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: steps.host.outputs.skip != 'true'
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}

      # Cross targets link with zig via cargo-zigbuild, installed under
      # RUNNER_TEMP. The rust-heavy runners are shared and not ephemeral, so
      # this job must never change their dpkg or apt state (no apt-get, no
      # dpkg --add-architecture). The build is rustls-only and needs no
      # target system libraries; ring and the bundled SQLite build with zig cc.
      - name: Install the zig cross linker
        if: steps.host.outputs.skip != 'true' && matrix.native == false && !contains(matrix.target, 'apple')
        shell: bash
        run: |
          set -euo pipefail
          zig="zig-x86_64-linux-0.15.2"
          curl -fsSL -o "$RUNNER_TEMP/$zig.tar.xz" "https://ziglang.org/download/0.15.2/$zig.tar.xz"
          echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  $RUNNER_TEMP/$zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$zig" >> "$GITHUB_PATH"
          # windows-gnu raw-dylib imports need a mingw dlltool; zig ships one.
          mkdir -p "$RUNNER_TEMP/zig-wrappers"
          printf '#!/bin/sh\nexec zig dlltool "$@"\n' > "$RUNNER_TEMP/zig-wrappers/x86_64-w64-mingw32-dlltool"
          chmod +x "$RUNNER_TEMP/zig-wrappers/x86_64-w64-mingw32-dlltool"
          echo "$RUNNER_TEMP/zig-wrappers" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version 0.23.4 --root "$RUNNER_TEMP/zigbuild"
          echo "$RUNNER_TEMP/zigbuild/bin" >> "$GITHUB_PATH"

      - name: Build email-server
        if: steps.host.outputs.skip != 'true'
        shell: bash
        run: |
          if [ "${{ matrix.native }}" = false ] && [ "$(uname -s)" != Darwin ]; then
            cargo zigbuild --locked --release -p email-server --bin email-server --target "${{ matrix.target }}"
          else
            cargo build --locked --release -p email-server --bin email-server --target "${{ matrix.target }}"
          fi

      # The shared runners have no system zip and their apt state must not be
      # changed, so the .zip is written with Python's zipfile module.
      - uses: actions/setup-python@v5
        if: steps.host.outputs.skip != 'true' && matrix.archive == 'zip'
        with:
          python-version: '3.12'

      - name: Package, checksum and SBOM without publishing
        if: steps.host.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-cyclonedx >/dev/null 2>&1; then
            cargo install --locked cargo-cyclonedx --version 0.5.7 --root "$RUNNER_TEMP/cyclonedx"
            export PATH="$RUNNER_TEMP/cyclonedx/bin:$PATH"
          fi
          target="${{ matrix.target }}"
          tag="dry-run"
          stage="$(mktemp -d)"
          bin="target/${target}/release/email-server"
          if [ "${{ matrix.archive }}" = zip ]; then
            bin="${bin}.exe"
            name="email-server-${tag}-${target}.zip"
            cp "$bin" "$stage/email-server.exe"
            (cd "$stage" && python -m zipfile -c "$name" email-server.exe)
          else
            name="email-server-${tag}-${target}.tar.gz"
            cp "$bin" "$stage/email-server"
            tar -C "$stage" -czf "$stage/$name" email-server
          fi
          mkdir -p release-artifacts
          mv "$stage/$name" "release-artifacts/$name"
          cargo cyclonedx --manifest-path crates/email-server/Cargo.toml \
            --format json --spec-version 1.5 \
            --override-filename "email-server-${tag}-${target}-sbom"
          mv "crates/email-server/email-server-${tag}-${target}-sbom.json" \
            "release-artifacts/email-server-${tag}-${target}.cdx.json"
          test -s "release-artifacts/${name}"
          test -s "release-artifacts/email-server-${tag}-${target}.cdx.json"
          echo "dry run packaged ${name}; nothing published"

      # checksum-assets downloads server-* and desktop-*, as release.yml's
      # attach-binaries does, so the dry run must upload under the same names.
      - uses: actions/upload-artifact@v4
        if: steps.host.outputs.skip != 'true'
        with:
          name: server-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 1

  desktop-binaries:
    needs: changes
    if: needs.changes.outputs.release == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    runs-on: [self-hosted, rust-heavy]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            target: x86_64-unknown-linux-gnu
            package: tar.gz
          - os: windows
            target: x86_64-pc-windows-gnu
            package: zip
          - os: macos
            target: aarch64-apple-darwin
            package: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Skip until the egui desktop crate exists
        id: crate
        shell: bash
        run: |
          if [ ! -f crates/email-desktop/Cargo.toml ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "crates/email-desktop/Cargo.toml is not in this revision."
            echo "Desktop packaging is skipped until the egui app lands. email-desktop-fluent is not built."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip macOS when this runner is not macOS
        if: steps.crate.outputs.skip != 'true'
        id: host
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = macos ] && [ "$(uname -s)" != Darwin ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The estate rust-heavy pool is not macOS; the macOS desktop package is skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: steps.crate.outputs.skip != 'true' && steps.host.outputs.skip != 'true'
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}

      # No system zip on the shared runners; see server-binaries.
      - uses: actions/setup-python@v5
        if: steps.crate.outputs.skip != 'true' && steps.host.outputs.skip != 'true' && matrix.package == 'zip'
        with:
          python-version: '3.12'

      - name: Build and package the egui desktop app without publishing
        if: steps.crate.outputs.skip != 'true' && steps.host.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p email-desktop --bin email-desktop --target "${{ matrix.target }}"
          target="${{ matrix.target }}"
          stage="$(mktemp -d)"
          bin="target/${target}/release/email-desktop"
          mkdir -p release-artifacts
          case "${{ matrix.package }}" in
            zip)
              cp "${bin}.exe" "$stage/email-desktop.exe"
              name="email-desktop-dry-run-${target}.zip"
              (cd "$stage" && python -m zipfile -c "$name" email-desktop.exe)
              mv "$stage/$name" "release-artifacts/$name"
              ;;
            *)
              cp "$bin" "$stage/email-desktop"
              name="email-desktop-dry-run-${target}.tar.gz"
              tar -C "$stage" -czf "$stage/$name" email-desktop
              mv "$stage/$name" "release-artifacts/$name"
              ;;
          esac
          echo "dry run packaged ${name}; nothing published"

      - uses: actions/upload-artifact@v4
        if: steps.crate.outputs.skip != 'true' && steps.host.outputs.skip != 'true'
        with:
          name: desktop-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 1

  # No checkout, like release.yml's attach-binaries, so a gh call that needs
  # a git repository fails here before a tag finds it.
  checksum-assets:
    needs: [changes, dry-run, server-binaries, desktop-binaries]
    if: always() && needs.changes.outputs.release == 'true' && needs.dry-run.result == 'success' && needs.server-binaries.result == 'success' && (needs.desktop-binaries.result == 'success' || needs.desktop-binaries.result == 'skipped')
    runs-on: [self-hosted, rust-heavy]
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: server-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: desktop-*
          merge-multiple: true
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          name: python-client
      - name: One SHA256SUMS lists every asset
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d release-artifacts ]; then
            echo "no server-* or desktop-* artifacts were downloaded" >&2
            exit 1
          fi
          find release-artifacts -name SHA256SUMS -delete
          (cd release-artifacts && sha256sum -- * > SHA256SUMS)
          missing=0
          for asset in release-artifacts/*; do
            base="$(basename "$asset")"
            [ "$base" = SHA256SUMS ] && continue
            grep -q " ${base}$" release-artifacts/SHA256SUMS || missing=1
          done
          test "$missing" -eq 0
          grep -q ".cdx.json" release-artifacts/SHA256SUMS
          grep -q "email-server-" release-artifacts/SHA256SUMS
          grep -q ".whl" release-artifacts/SHA256SUMS
          grep -q "email_rs_client-.*\.tar\.gz" release-artifacts/SHA256SUMS
          echo "combined checksum covers every dry-run asset"

      # Read-only gh release calls, with no checkout and the repo from
      # GH_REPO, as attach-binaries runs gh release create. Creates nothing.
      - name: Exercise the gh release path without publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -d .git
          gh release list --repo "$GH_REPO" --limit 1
          latest="$(gh release list --repo "$GH_REPO" --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -n "$latest" ]; then
            gh release view "$latest" --repo "$GH_REPO" --json tagName,assets --jq '.tagName, (.assets | length)'
          fi
          gh release create --help >/dev/null
          echo "gh release path works without a checkout; nothing created"

  # The required check. Fails if any job that ran failed or was cancelled;
  # passes when the heavy jobs were skipped because no release path changed.
  release-dry-run:
    needs: [changes, dry-run, server-binaries, desktop-binaries, checksum-assets]
    if: always()
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - name: Check job results
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "a release dry-run job ended with: $r" >&2; exit 1 ;;
            esac
          done
