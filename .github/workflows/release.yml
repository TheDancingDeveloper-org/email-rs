# Publish a versioned email-server image and the Python client package.
# A tag is never the first run of this build: release-dry-run builds both
# artifacts without publishing on PRs that touch this workflow and nightly
# on main. Version and sha tags only; never a latest-only publish.

name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-rs-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-dry-run:
    if: github.event_name != 'push'
    runs-on: [self-hosted, docker, publish]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the server image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: email-rs:dry-run

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the Python client package without publishing
        working-directory: clients/python
        run: |
          python -m pip install --upgrade build
          python -m build
          test -n "$(find dist -name '*.whl' -o -name '*.tar.gz' | head -n 1)"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    runs-on: [self-hosted, docker, publish]
    env:
      IMAGE: ghcr.io/thedancingdeveloper-org/email-rs
    steps:
      - uses: actions/checkout@v4

      - name: Require a version tag
        run: |
          test "${GITHUB_REF_TYPE}" = tag
          case "${GITHUB_REF_NAME}" in v[0-9]*) ;; *) exit 1 ;; esac

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the versioned server image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the Python client package
        working-directory: clients/python
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish the GitHub release with the image digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          notes="$(mktemp)"
          {
            echo "## Image"
            echo
            echo "\`${IMAGE}:${GITHUB_REF_NAME}\`"
            echo
            echo "Digest: \`${IMAGE}@${IMAGE_DIGEST}\`"
            echo
            echo "Immutable tag: \`${IMAGE}:sha-${GITHUB_SHA}\`"
          } > "$notes"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes" \
            clients/python/dist/*
