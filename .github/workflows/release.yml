name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  linux-binary:
    name: Linux server and Fluent desktop binaries
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Install Fluent desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npx vite build --outDir ../release/static --emptyOutDir

      - name: Build binary
        run: |
          cargo build --release --locked -p email-server -p email-desktop-fluent
          mkdir -p release
          cp target/release/email-server release/email-server
          cp target/release/email-desktop-fluent release/email-desktop-fluent
          cd release && tar czf ../email-rs-linux-x86_64.tar.gz .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: email-rs-linux-x86_64.tar.gz

  docker:
    name: Docker image (GHCR)
    runs-on: [self-hosted, docker, publish]
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/thedancingdeveloper-org/email-rs
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the published digest
        run: |
          set -euo pipefail
          test -n "${{ steps.image.outputs.digest }}"
          echo "digest ${{ steps.image.outputs.digest }}"

  release-notes:
    name: Put the image digest in the release notes
    needs: docker
    runs-on: [self-hosted]
    steps:
      - name: Append digest
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Container image: `ghcr.io/thedancingdeveloper-org/email-rs@${{ needs.docker.outputs.digest }}`
          append_body: true
