# Publish a versioned email-server image and the Python client package.
# Version and sha tags only; never a latest-only publish.
# The untagged dry run lives in release-dry-run.yml (fork-guarded, no publish label).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-rs-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    runs-on: [self-hosted, docker, publish]
    env:
      IMAGE: ghcr.io/thedancingdeveloper-org/email-rs
    steps:
      - uses: actions/checkout@v4

      - name: Require a version tag
        run: |
          test "${GITHUB_REF_TYPE}" = tag
          case "${GITHUB_REF_NAME}" in v[0-9]*) ;; *) exit 1 ;; esac

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the versioned server image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the Python client package
        working-directory: clients/python
        run: |
          python -m pip install --upgrade build
          python -m build

  # email-server binaries. Linux amd64 and arm64, plus Windows, are built on
  # the estate rust-heavy pool (cross via cargo-zigbuild). macOS is built only when the
  # runner is already macOS; the estate pool is Linux, so that target is
  # skipped with a message rather than failing the release.
  # email-desktop-fluent is not built (WI-722 retires it).
  server-binaries:
    needs: release
    permissions:
      contents: read
    runs-on: [self-hosted, rust-heavy]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: tar.gz
            native: true
          - target: aarch64-unknown-linux-gnu
            archive: tar.gz
            native: false
          - target: x86_64-pc-windows-gnu
            archive: zip
            native: false
          - target: aarch64-apple-darwin
            archive: tar.gz
            native: false
    steps:
      - uses: actions/checkout@v4

      - name: Skip macOS when this runner is not macOS
        id: host
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *-apple-darwin)
              if [ "$(uname -s)" != Darwin ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "The estate rust-heavy pool is not macOS; ${{ matrix.target }} is skipped."
                echo "A macOS runner will build this target when one is in the pool."
              else
                echo "skip=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: steps.host.outputs.skip != 'true'
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}

      # Cross targets link with zig via cargo-zigbuild, installed under
      # RUNNER_TEMP. The rust-heavy runners are shared and not ephemeral, so
      # this job must never change their dpkg or apt state (no apt-get, no
      # dpkg --add-architecture). The build is rustls-only and needs no
      # target system libraries; ring and the bundled SQLite build with zig cc.
      - name: Install the zig cross linker
        if: steps.host.outputs.skip != 'true' && matrix.native == false && !contains(matrix.target, 'apple')
        shell: bash
        run: |
          set -euo pipefail
          zig="zig-x86_64-linux-0.15.2"
          curl -fsSL -o "$RUNNER_TEMP/$zig.tar.xz" "https://ziglang.org/download/0.15.2/$zig.tar.xz"
          echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  $RUNNER_TEMP/$zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$zig" >> "$GITHUB_PATH"
          # windows-gnu raw-dylib imports need a mingw dlltool; zig ships one.
          mkdir -p "$RUNNER_TEMP/zig-wrappers"
          printf '#!/bin/sh\nexec zig dlltool "$@"\n' > "$RUNNER_TEMP/zig-wrappers/x86_64-w64-mingw32-dlltool"
          chmod +x "$RUNNER_TEMP/zig-wrappers/x86_64-w64-mingw32-dlltool"
          echo "$RUNNER_TEMP/zig-wrappers" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version 0.23.4 --root "$RUNNER_TEMP/zigbuild"
          echo "$RUNNER_TEMP/zigbuild/bin" >> "$GITHUB_PATH"

      - name: Build email-server
        if: steps.host.outputs.skip != 'true'
        shell: bash
        run: |
          if [ "${{ matrix.native }}" = false ] && [ "$(uname -s)" != Darwin ]; then
            cargo zigbuild --locked --release -p email-server --bin email-server --target "${{ matrix.target }}"
          else
            cargo build --locked --release -p email-server --bin email-server --target "${{ matrix.target }}"
          fi

      # The shared runners have no system zip and their apt state must not be
      # changed, so the .zip is written with Python's zipfile module.
      - uses: actions/setup-python@v5
        if: steps.host.outputs.skip != 'true' && matrix.archive == 'zip'
        with:
          python-version: '3.12'

      # The shared runners have no system zip and their apt state must not be
      # changed, so the .zip is written with Python's zipfile module.
      - uses: actions/setup-python@v5
        if: steps.host.outputs.skip != 'true' && matrix.archive == 'zip'
        with:
          python-version: '3.12'

      # The shared runners have no system zip and their apt state must not be
      # changed, so the .zip is written with Python's zipfile module.
      - uses: actions/setup-python@v5
        if: steps.host.outputs.skip != 'true' && matrix.archive == 'zip'
        with:
          python-version: '3.12'

      - name: Install cargo-cyclonedx once
        if: steps.host.outputs.skip != 'true'
        shell: bash
        run: |
          if ! command -v cargo-cyclonedx >/dev/null 2>&1; then
            cargo install --locked cargo-cyclonedx --version 0.5.7 --root "$RUNNER_TEMP/cyclonedx"
            echo "$RUNNER_TEMP/cyclonedx/bin" >> "$GITHUB_PATH"
          fi

      - name: Package, checksum and SBOM
        if: steps.host.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          tag="$GITHUB_REF_NAME"
          stage="$(mktemp -d)"
          bin="target/${target}/release/email-server"
          if [ "${{ matrix.archive }}" = zip ]; then
            bin="${bin}.exe"
            name="email-server-${tag}-${target}.zip"
            cp "$bin" "$stage/email-server.exe"
            (cd "$stage" && python -m zipfile -c "$name" email-server.exe)
          else
            name="email-server-${tag}-${target}.tar.gz"
            cp "$bin" "$stage/email-server"
            tar -C "$stage" -czf "$stage/$name" email-server
          fi
          mkdir -p release-artifacts
          mv "$stage/$name" "release-artifacts/$name"
          cargo cyclonedx --manifest-path crates/email-server/Cargo.toml \
            --format json --spec-version 1.5 \
            --override-filename "email-server-${tag}-${target}-sbom"
          mv "crates/email-server/email-server-${tag}-${target}-sbom.json" \
            "release-artifacts/email-server-${tag}-${target}.cdx.json"

      - uses: actions/upload-artifact@v4
        if: steps.host.outputs.skip != 'true'
        with:
          name: server-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error

  # The egui desktop crate does not exist yet (F0 spike). Skip cleanly until
  # crates/email-desktop/Cargo.toml lands. Never build email-desktop-fluent.
  desktop-binaries:
    needs: release
    permissions:
      contents: read
    runs-on: [self-hosted, rust-heavy]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            target: x86_64-unknown-linux-gnu
            package: tar.gz
          - os: windows
            target: x86_64-pc-windows-gnu
            package: zip
          - os: macos
            target: aarch64-apple-darwin
            package: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Skip until the egui desktop crate exists
        id: crate
        shell: bash
        run: |
          if [ ! -f crates/email-desktop/Cargo.toml ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "crates/email-desktop/Cargo.toml is not in this revision."
            echo "Desktop packaging is skipped until the egui app lands. email-desktop-fluent is not built."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip macOS when this runner is not macOS
        if: steps.crate.outputs.skip != 'true'
        id: host
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = macos ] && [ "$(uname -s)" != Darwin ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The estate rust-heavy pool is not macOS; the macOS desktop package is skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: steps.crate.outputs.skip != 'true' && steps.host.outputs.skip != 'true'
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}

      # No system zip on the shared runners; see server-binaries.
      - uses: actions/setup-python@v5
        if: steps.crate.outputs.skip != 'true' && steps.host.outputs.skip != 'true' && matrix.package == 'zip'
        with:
          python-version: '3.12'

      # No system zip on the shared runners; see server-binaries.
      - uses: actions/setup-python@v5
        if: steps.crate.outputs.skip != 'true' && steps.host.outputs.skip != 'true' && matrix.package == 'zip'
        with:
          python-version: '3.12'

      # No system zip on the shared runners; see server-binaries.
      - uses: actions/setup-python@v5
        if: steps.crate.outputs.skip != 'true' && steps.host.outputs.skip != 'true' && matrix.package == 'zip'
        with:
          python-version: '3.12'

      - name: Build the egui desktop app
        if: steps.crate.outputs.skip != 'true' && steps.host.outputs.skip != 'true'
        shell: bash
        run: |
          cargo build --locked --release -p email-desktop --bin email-desktop --target "${{ matrix.target }}"

      - name: Package the desktop app
        if: steps.crate.outputs.skip != 'true' && steps.host.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          tag="$GITHUB_REF_NAME"
          stage="$(mktemp -d)"
          bin="target/${target}/release/email-desktop"
          mkdir -p release-artifacts
          case "${{ matrix.package }}" in
            zip)
              cp "${bin}.exe" "$stage/email-desktop.exe"
              name="email-desktop-${tag}-${target}.zip"
              (cd "$stage" && python -m zipfile -c "$name" email-desktop.exe)
              mv "$stage/$name" "release-artifacts/$name"
              ;;
            *)
              cp "$bin" "$stage/email-desktop"
              name="email-desktop-${tag}-${target}.tar.gz"
              tar -C "$stage" -czf "$stage/$name" email-desktop
              mv "$stage/$name" "release-artifacts/$name"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        if: steps.crate.outputs.skip != 'true' && steps.host.outputs.skip != 'true'
        with:
          name: desktop-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error

  # rust-heavy builds only read the repo. Attaching release assets needs
  # contents: write, and that token stays on the publish runner.
  attach-binaries:
    needs: [release, server-binaries, desktop-binaries]
    if: always() && needs.release.result == 'success' && needs.server-binaries.result == 'success' && (needs.desktop-binaries.result == 'success' || needs.desktop-binaries.result == 'skipped')
    permissions:
      contents: write
    runs-on: [self-hosted, publish]
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: server-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: desktop-*
          merge-multiple: true
        continue-on-error: true

      - name: Checksum every attached asset
        shell: bash
        run: |
          set -euo pipefail
          find release-artifacts -name SHA256SUMS -delete
          (cd release-artifacts && sha256sum -- * > SHA256SUMS)
          missing=0
          for asset in release-artifacts/*; do
            base="$(basename "$asset")"
            [ "$base" = SHA256SUMS ] && continue
            if ! grep -q " ${base}$" release-artifacts/SHA256SUMS; then
              echo "missing from SHA256SUMS: $base" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0
          test -s release-artifacts/SHA256SUMS

      - name: Publish the GitHub release, then attach binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/thedancingdeveloper-org/email-rs
          IMAGE_DIGEST: ${{ needs.release.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          find release-artifacts -type f | sort
          test -n "$(find release-artifacts -type f -print -quit)"
          test -s release-artifacts/SHA256SUMS
          test -n "$IMAGE_DIGEST"
          notes="$(mktemp)"
          {
            echo "## Image"
            echo
            echo "\`${IMAGE}:${GITHUB_REF_NAME}\`"
            echo
            echo "Digest: \`${IMAGE}@${IMAGE_DIGEST}\`"
            echo
            echo "Immutable tag: \`${IMAGE}:sha-${GITHUB_SHA}\`"
          } > "$notes"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes" \
            release-artifacts/*
