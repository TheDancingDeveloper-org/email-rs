# Publish a versioned email-server image and the Python client package.
# Version and sha tags only; never a latest-only publish.
# The untagged dry run lives in release-dry-run.yml (fork-guarded, no publish label).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-rs-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    runs-on: [self-hosted, docker, publish]
    env:
      IMAGE: ghcr.io/thedancingdeveloper-org/email-rs
    steps:
      - uses: actions/checkout@v4

      - name: Require a version tag
        run: |
          test "${GITHUB_REF_TYPE}" = tag
          case "${GITHUB_REF_NAME}" in v[0-9]*) ;; *) exit 1 ;; esac

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the versioned server image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the Python client package
        working-directory: clients/python
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish the GitHub release with the image digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          notes="$(mktemp)"
          {
            echo "## Image"
            echo
            echo "\`${IMAGE}:${GITHUB_REF_NAME}\`"
            echo
            echo "Digest: \`${IMAGE}@${IMAGE_DIGEST}\`"
            echo
            echo "Immutable tag: \`${IMAGE}:sha-${GITHUB_SHA}\`"
          } > "$notes"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes" \
            clients/python/dist/*

  # email-server binaries. Linux amd64 and arm64, plus Windows, are built on
  # the estate rust-heavy pool (cross via cargo). macOS is built only when the
  # runner is already macOS; the estate pool is Linux, so that target is
  # skipped with a message rather than failing the release.
  # email-desktop-fluent is not built (WI-722 retires it).
  server-binaries:
    needs: release
    permissions:
      contents: read
    runs-on: [self-hosted, rust-heavy]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: tar.gz
            native: true
          - target: aarch64-unknown-linux-gnu
            archive: tar.gz
            native: false
          - target: x86_64-pc-windows-gnu
            archive: zip
            native: false
          - target: aarch64-apple-darwin
            archive: tar.gz
            native: false
    steps:
      - uses: actions/checkout@v4

      - name: Skip macOS when this runner is not macOS
        id: host
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *-apple-darwin)
              if [ "$(uname -s)" != Darwin ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "The estate rust-heavy pool is not macOS; ${{ matrix.target }} is skipped."
                echo "A macOS runner will build this target when one is in the pool."
              else
                echo "skip=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: steps.host.outputs.skip != 'true'
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}

      - name: Install the cross linker
        if: steps.host.outputs.skip != 'true' && matrix.native == false && !contains(matrix.target, 'apple')
        shell: bash
        run: |
          if [ "$(id -u)" -eq 0 ]; then APT=apt-get; else APT="sudo apt-get"; fi
          $APT update
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              dpkg --add-architecture arm64
              $APT update
              $APT install -y gcc-aarch64-linux-gnu pkg-config libssl-dev:arm64
              ;;
            x86_64-pc-windows-gnu)
              $APT install -y gcc-mingw-w64-x86-64
              ;;
          esac

      - name: Build email-server
        if: steps.host.outputs.skip != 'true'
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_SYSROOT_DIR: /usr/aarch64-linux-gnu
        run: |
          cargo build --locked --release -p email-server --bin email-server --target "${{ matrix.target }}"

      - name: Install cargo-cyclonedx once
        if: steps.host.outputs.skip != 'true'
        shell: bash
        run: |
          if ! command -v cargo-cyclonedx >/dev/null 2>&1; then
            cargo install --locked cargo-cyclonedx --version 0.5.7 --root "$RUNNER_TEMP/cyclonedx"
            echo "$RUNNER_TEMP/cyclonedx/bin" >> "$GITHUB_PATH"
          fi

      - name: Package, checksum and SBOM
        if: steps.host.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          tag="$GITHUB_REF_NAME"
          stage="$(mktemp -d)"
          bin="target/${target}/release/email-server"
          if [ "${{ matrix.archive }}" = zip ]; then
            bin="${bin}.exe"
            name="email-server-${tag}-${target}.zip"
            cp "$bin" "$stage/email-server.exe"
            (cd "$stage" && zip -q -r "$name" email-server.exe)
          else
            name="email-server-${tag}-${target}.tar.gz"
            cp "$bin" "$stage/email-server"
            tar -C "$stage" -czf "$stage/$name" email-server
          fi
          mkdir -p release-artifacts
          mv "$stage/$name" "release-artifacts/$name"
          cargo cyclonedx --manifest-path crates/email-server/Cargo.toml \
            --format json --spec-version 1.5 \
            --override-filename "email-server-${tag}-${target}-sbom"
          mv "crates/email-server/email-server-${tag}-${target}-sbom.json" \
            "release-artifacts/email-server-${tag}-${target}.cdx.json"
          (cd release-artifacts && sha256sum -- * > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        if: steps.host.outputs.skip != 'true'
        with:
          name: server-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error

  # The egui desktop crate does not exist yet (F0 spike). Skip cleanly until
  # crates/email-desktop/Cargo.toml lands. Never build email-desktop-fluent.
  desktop-binaries:
    needs: release
    permissions:
      contents: read
    runs-on: [self-hosted, rust-heavy]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            target: x86_64-unknown-linux-gnu
            package: tar.gz
          - os: windows
            target: x86_64-pc-windows-gnu
            package: zip
          - os: macos
            target: aarch64-apple-darwin
            package: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Skip until the egui desktop crate exists
        id: crate
        shell: bash
        run: |
          if [ ! -f crates/email-desktop/Cargo.toml ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "crates/email-desktop/Cargo.toml is not in this revision."
            echo "Desktop packaging is skipped until the egui app lands. email-desktop-fluent is not built."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip macOS when this runner is not macOS
        if: steps.crate.outputs.skip != 'true'
        id: host
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = macos ] && [ "$(uname -s)" != Darwin ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The estate rust-heavy pool is not macOS; the macOS desktop package is skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: steps.crate.outputs.skip != 'true' && steps.host.outputs.skip != 'true'
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}

      - name: Build the egui desktop app
        if: steps.crate.outputs.skip != 'true' && steps.host.outputs.skip != 'true'
        shell: bash
        run: |
          cargo build --locked --release -p email-desktop --bin email-desktop --target "${{ matrix.target }}"

      - name: Package the desktop app
        if: steps.crate.outputs.skip != 'true' && steps.host.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          tag="$GITHUB_REF_NAME"
          stage="$(mktemp -d)"
          bin="target/${target}/release/email-desktop"
          mkdir -p release-artifacts
          case "${{ matrix.package }}" in
            zip)
              cp "${bin}.exe" "$stage/email-desktop.exe"
              name="email-desktop-${tag}-${target}.zip"
              (cd "$stage" && zip -q -r "$name" email-desktop.exe)
              mv "$stage/$name" "release-artifacts/$name"
              ;;
            *)
              cp "$bin" "$stage/email-desktop"
              name="email-desktop-${tag}-${target}.tar.gz"
              tar -C "$stage" -czf "$stage/$name" email-desktop
              mv "$stage/$name" "release-artifacts/$name"
              ;;
          esac
          (cd release-artifacts && sha256sum -- * > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        if: steps.crate.outputs.skip != 'true' && steps.host.outputs.skip != 'true'
        with:
          name: desktop-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error

  # rust-heavy builds only read the repo. Attaching release assets needs
  # contents: write, and that token stays on the publish runner.
  attach-binaries:
    needs: [release, server-binaries, desktop-binaries]
    if: always() && needs.release.result == 'success' && needs.server-binaries.result == 'success' && (needs.desktop-binaries.result == 'success' || needs.desktop-binaries.result == 'skipped')
    permissions:
      contents: write
    runs-on: [self-hosted, publish]
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: server-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: desktop-*
          merge-multiple: true
        continue-on-error: true

      - name: Attach binaries to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          find release-artifacts -type f | sort
          test -n "$(find release-artifacts -type f -print -quit)"
          gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
