name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  clean-checkout:
    name: Clean checkout workspace
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///tmp/email-test.db
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Reject dependencies outside the repository
        run: |
          if git grep -nE 'path[[:space:]]*=[[:space:]]*"\.\./\.\./\.\.' -- '*Cargo.toml'; then
            echo "Cargo manifests must not depend on sibling repositories"
            exit 1
          fi

      - name: Install native desktop build dependencies
        run: |
          apt-get update
          apt-get install -y pkg-config libssl-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Verify locked dependency resolution
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: Export schema-bearing OpenAPI contract
        run: |
          cargo run -q -p email-server --bin export_openapi --locked > /tmp/email-rs-openapi.json
          python3 - <<'PY'
          import json
          import tomllib
          doc = json.load(open('/tmp/email-rs-openapi.json'))
          version = tomllib.load(open('crates/email-server/Cargo.toml', 'rb'))['package']['version']
          assert doc['openapi'] == '3.1.0'
          assert doc['info']['version'] == version
          assert len(doc['paths']) >= 50
          PY

      - name: Type-check generated Python client syntax
        run: python3 -m compileall -q clients/python/email_rs_client

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Build production image from a clean checkout
        run: docker build --tag email-rs-ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx vite build --outDir /tmp/frontend-dist --emptyOutDir

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
