services:
  proxy:
    image: caddy@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5 # 2-alpine
    ports:
      - "8585:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target-cache:/app/target
      - db-data:/data
    environment:
      DATABASE_URL: sqlite:///data/email.db
      HOST: 0.0.0.0
      PORT: "3000"
      FRONTEND_DIST: /app/crates/email-server/static
      # Development-only HTTP between the host and local Caddy.
      EMAIL_RS_ALLOW_INSECURE_HTTP: "true"
      GOOGLE_REDIRECT_URI: http://localhost:8585/api/v1/auth/gmail/callback
      MICROSOFT_REDIRECT_URI: http://localhost:8585/api/v1/auth/microsoft/callback
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - node-modules:/app/node_modules
    restart: unless-stopped

volumes:
  cargo-registry:
  cargo-git:
  target-cache:
  db-data:
  node-modules:
