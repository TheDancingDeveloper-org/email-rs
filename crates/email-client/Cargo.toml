[package]
name = "email-client"
version = "0.7.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
email-types = { path = "../email-types" }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
