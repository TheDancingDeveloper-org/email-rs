[package]
name = "email-client"
version = "0.7.1"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
email-types = { path = "../email-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

# rustls is not a wasm target. Native keeps rustls-tls; wasm uses the
# default reqwest feature set minus rustls so `cargo check --target wasm32`
# does not pull ring into this crate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
