[package]
name = "email-server"
version = "0.7.0"
edition = "2021"
default-run = "email-server"

[[bin]]
name = "email-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "uuid"] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport", "hostname", "mime03", "tracing"] }
mail-parser = "0.9"
htmd = "0.5"
markup5ever_rcdom = "0.38"
regex = "1"
oauth2 = "5"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
webpki-roots = "0.26"
base64 = "0.22"
aes-gcm = "0.10"
urlencoding = "2"
tokio-stream = { version = "0.1", features = ["sync"] }
hmac-sha256 = "1"
dotenvy = "0.15"
argon2 = "0.6"
sha2 = "0.11"
email-types = { path = "../email-types", features = ["server"] }
utoipa = { version = "5", features = ["chrono"] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.25"
tao = "0.35"
wry = "0.47"
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
desktop = ["dep:gtk", "dep:webkit2gtk", "dep:gdk-pixbuf"]

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
webkit2gtk = { version = "2.0", features = ["v2_40"], optional = true }
gdk-pixbuf = { version = "0.18", optional = true }

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
