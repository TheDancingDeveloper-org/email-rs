[package]
name = "email-desktop-fluent"
version = "0.8.0"
edition = "2021"
license.workspace = true

[dependencies]
anyhow = "1"
libc = "0.2"
chrono = { version = "0.4", features = ["clock"] }
dotenvy = "0.15"
email-client = { path = "../email-client" }
email-server = { path = "../email-server" }
email-types = { path = "../email-types" }
fluent-app = { git = "https://github.com/thedancingdeveloper/fluent-gpui.git", rev = "2b7730635a872df1981ef4f3ceef1427a5776555" }
fluent-core = { git = "https://github.com/thedancingdeveloper/fluent-gpui.git", rev = "2b7730635a872df1981ef4f3ceef1427a5776555" }
fluent-layout = { git = "https://github.com/thedancingdeveloper/fluent-gpui.git", rev = "2b7730635a872df1981ef4f3ceef1427a5776555" }
fluent-primitives = { git = "https://github.com/thedancingdeveloper/fluent-gpui.git", rev = "2b7730635a872df1981ef4f3ceef1427a5776555" }
gpui = { git = "https://github.com/thedancingdeveloper/fluent-gpui.git", rev = "2b7730635a872df1981ef4f3ceef1427a5776555" }
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
gpui = { git = "https://github.com/thedancingdeveloper/fluent-gpui.git", rev = "2b7730635a872df1981ef4f3ceef1427a5776555", features = ["test-support"] }
fluent-test-utils = { git = "https://github.com/thedancingdeveloper/fluent-gpui.git", rev = "2b7730635a872df1981ef4f3ceef1427a5776555" }
