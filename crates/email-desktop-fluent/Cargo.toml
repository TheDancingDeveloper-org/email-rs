[package]
name = "email-desktop-fluent"
version = "0.8.0"
edition = "2021"
license.workspace = true

[dependencies]
anyhow = "1"
libc = "0.2"
chrono = { version = "0.4", features = ["clock"] }
dotenvy = "0.15"
email-client = { path = "../email-client" }
email-server = { path = "../email-server" }
email-types = { path = "../email-types" }
fluent-app = { git = "https://github.com/thedancingdeveloper/fluent-gpui.git", rev = "1b61b73a20377ae7adbb411727fd9e8e13a353be" }
fluent-core = { git = "https://github.com/thedancingdeveloper/fluent-gpui.git", rev = "1b61b73a20377ae7adbb411727fd9e8e13a353be" }
fluent-layout = { git = "https://github.com/thedancingdeveloper/fluent-gpui.git", rev = "1b61b73a20377ae7adbb411727fd9e8e13a353be" }
fluent-primitives = { git = "https://github.com/thedancingdeveloper/fluent-gpui.git", rev = "1b61b73a20377ae7adbb411727fd9e8e13a353be" }
gpui = { git = "https://github.com/thedancingdeveloper/fluent-gpui.git", rev = "1b61b73a20377ae7adbb411727fd9e8e13a353be" }
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
rfd = "0.15"

[dev-dependencies]
gpui = { git = "https://github.com/thedancingdeveloper/fluent-gpui.git", rev = "1b61b73a20377ae7adbb411727fd9e8e13a353be", features = ["test-support"] }
fluent-test-utils = { git = "https://github.com/thedancingdeveloper/fluent-gpui.git", rev = "1b61b73a20377ae7adbb411727fd9e8e13a353be" }
