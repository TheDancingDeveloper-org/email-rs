[package]
name = "email-types"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["sqlite", "chrono", "uuid"], optional = true }

[features]
default = []
server = ["dep:sqlx"]
