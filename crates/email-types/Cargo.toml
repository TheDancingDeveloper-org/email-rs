[package]
name = "email-types"
version = "0.5.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
utoipa = { version = "5", features = ["chrono"] }
sqlx = { version = "0.8", features = ["sqlite", "chrono", "uuid"], optional = true }

[features]
default = []
server = ["dep:sqlx"]
