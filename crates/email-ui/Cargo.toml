[package]
name = "email-ui"
version = "0.7.0"
edition = "2021"
publish = false
description = "fluent2-egui client for email-rs: app shell, sign-in and read path."

[[bin]]
name = "email-ui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
# monochrome_emoji_fonts: without it egui 0.37 panics drawing the warning glyph
# fluent2-egui puts in error fields (see fluent2-egui Cargo.toml).
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
email-client = { path = "../email-client" }
email-types = { path = "../email-types" }
fluent2-egui = { git = "https://github.com/TheDancingDeveloper-org/fluent2-egui.git", tag = "v0.4.1", features = ["html"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
egui_kittest = "0.37"
reqwest = "0.12"
